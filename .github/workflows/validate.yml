name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv run --with homeassistant --with aiohasupervisor --with serialx --with bluetooth-adapters --with aiousbwatcher --with pyserial --with pytest python -m pytest
      - run: uv run --with ruff ruff check .

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hassfest with registry retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if docker pull ghcr.io/home-assistant/hassfest:latest; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            ghcr.io/home-assistant/hassfest:latest

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
