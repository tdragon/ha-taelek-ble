[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-taelek-ble"
version = "0.1.0"
description = "Passive Home Assistant integration for Taelek ecoControl BLE thermostats"
requires-python = ">=3.13"
license = "MIT"
authors = [{name = "Dmitrii"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "PIE", "RET", "SIM", "UP"]
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
